[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sin-code-oracle"
version = "0.1.0"
description = "SIN-Code Verification Oracle — automated security, performance, correctness, style, and test verification"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SIN-Code"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "bandit>=1.7",
    "ruff>=0.1",
    "hypothesis>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.2"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/SIN-Rotator/SIN-Code-Verification-Oracle"
Repository = "https://github.com/SIN-Rotator/SIN-Code-Verification-Oracle"

[project.scripts]
oracle = "sin_code_oracle.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sin_code_oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W", "B", "C4", "UP"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
